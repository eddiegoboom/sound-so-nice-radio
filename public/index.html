<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sound So Nice Radio</title>
  <meta name="description" content="Sound So Nice Radio: listen back to past episodes and follow along on social media.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap">
      <div class="logo-plate"><img id="logo" class="logo" alt="" width="150" height="150"></div>
      <h1 id="site-title" class="site-title">Sound So Nice Radio</h1>
      <p id="tagline" class="tagline"></p>
      <p id="show-desc" class="show-desc" hidden></p>
      <p id="schedule" class="schedule-line" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <section class="card player" aria-labelledby="np-title">
      <p id="np-badge" class="badge" hidden>Latest episode</p>
      <h2 id="np-title">Loading…</h2>
      <p id="np-theme" class="theme" hidden></p>
      <dl id="np-people" class="people"></dl>
      <div id="np-show-wrap" class="in-show" hidden>
        <h3>In this show</h3>
        <ul id="np-show"></ul>
      </div>
      <p id="np-desc" class="desc" hidden></p>

      <audio id="audio" preload="none"></audio>

      <div class="controls">
        <input id="seek" class="seek" type="range" min="0" max="0" step="1" value="0" disabled aria-label="Seek">
        <div class="times"><span id="t-cur">0:00</span><span id="t-dur">--:--</span></div>
        <div class="buttons">
          <button id="b-prev" class="btn-icon" type="button" aria-label="Previous episode (newer)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg>
          </button>
          <button id="b-back" class="btn-text" type="button" aria-label="Back 15 seconds">&minus;15s</button>
          <button id="b-play" class="btn-play" type="button" aria-label="Play">
            <svg id="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="i-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="b-fwd" class="btn-text" type="button" aria-label="Forward 30 seconds">+30s</button>
          <button id="b-next" class="btn-icon" type="button" aria-label="Next episode (older)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg>
          </button>
        </div>
        <label class="volume">
          <span>Volume</span>
          <input id="vol" type="range" min="0" max="1" step="0.05" value="1">
        </label>
        <div class="share">
          <button id="b-share" class="btn-share" type="button">Copy link at <span id="share-time">0:00</span></button>
        </div>
        <p id="player-msg" class="msg" role="status" hidden></p>
      </div>
    </section>

    <section aria-labelledby="pl-h">
      <h2 id="pl-h" class="section-h">Episodes</h2>
      <form id="filters" class="filters" role="search" hidden>
        <label class="f-search"><span class="sr-only">Search episodes</span>
          <input id="f-q" type="search" placeholder="Search title, theme, people, description…" autocomplete="off">
        </label>
        <label class="f-select"><span>Host</span>
          <select id="f-host"><option value="">All hosts</option></select>
        </label>
        <label class="f-select"><span>Guest</span>
          <select id="f-guest"><option value="">All guests</option></select>
        </label>
        <label class="f-select"><span>DJ mix</span>
          <select id="f-dj"><option value="">All DJs</option></select>
        </label>
        <button id="f-clear" class="btn-text" type="button" hidden>Clear</button>
      </form>
      <ol id="playlist" class="playlist"></ol>
      <p id="pl-status" class="msg" role="status"></p>
      <button id="pl-more" class="btn-more" type="button" hidden>Show more</button>
    </section>

    <section id="submit-sec" aria-labelledby="submit-h" hidden>
      <h2 id="submit-h" class="section-h">Submit your music</h2>
      <p id="submit-text" class="about"></p>
      <div id="submit-actions" class="submit-actions"></div>
    </section>

    <section id="social-sec" aria-labelledby="soc-h" hidden>
      <h2 id="soc-h" class="section-h">Follow along</h2>
      <ul id="social" class="social"></ul>
    </section>

    <section id="about-sec" aria-labelledby="about-h" hidden>
      <h2 id="about-h" class="section-h">About</h2>
      <p id="about" class="about"></p>
    </section>

    <section id="admin" hidden>
      <h2 class="section-h">Admin view</h2>
      <p class="msg">Not linked from the site. Use this to find the date and time to put in the Playlist sheet.</p>
      <div id="admin-warnings"></div>
      <div class="table-wrap"><table id="admin-table"></table></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="footer-text"></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
