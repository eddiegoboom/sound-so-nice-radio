name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Refresh public/episodes.json from the archive folder. If the archive is
      # down we keep the committed copy and still deploy the rest of the site.
      - name: Fetch episode list
        run: python3 scripts/fetch_episodes.py
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
